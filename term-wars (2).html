:root {
  --bg: #0a0a1a;
  --panel: #12122a;
  --border: #2a2a5a;
  --neon-blue: #00f0ff;
  --neon-green: #00ff88;
  --neon-yellow: #ffee00;
  --neon-pink: #ff00aa;
  --neon-orange: #ff6600;
  --neon-red: #ff2244;
  --text: #e0e0ff;
  --dim: #6666aa;
  --coeff-color: #ff6600;
  --var-color: #00f0ff;
  --exp-color: #ffee00;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', 'MonoFallback', 'Courier New', monospace;
  font-size: 15px;
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
}

/* SCANLINES EFFECT */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  pointer-events: none;
  z-index: 9999;
}

.screen {
  display: none;
  min-height: 100vh;
  padding: 20px;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
.screen.active { display: flex; }

/* TITLE SCREEN */
#screen-title {
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a0a3a 0%, #0a0a1a 70%);
}

.title-logo {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: clamp(28px, 8vw, 72px);
  color: var(--neon-yellow);
  text-shadow: 0 0 20px var(--neon-yellow), 0 0 40px var(--neon-orange), 4px 4px 0 #aa6600;
  text-align: center;
  line-height: 1.4;
  animation: titlePulse 2s ease-in-out infinite;
  margin-bottom: 10px;
}

.title-sub {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(10px, 3vw, 16px);
  color: var(--neon-blue);
  text-align: center;
  letter-spacing: 4px;
  margin-bottom: 40px;
  text-shadow: 0 0 10px var(--neon-blue);
}

@keyframes titlePulse {
  0%,100% { text-shadow: 0 0 20px var(--neon-yellow), 0 0 40px var(--neon-orange), 4px 4px 0 #aa6600; }
  50% { text-shadow: 0 0 40px var(--neon-yellow), 0 0 80px var(--neon-orange), 4px 4px 0 #aa6600; }
}

.name-input-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  margin-bottom: 30px;
  width: 100%;
  max-width: 400px;
}

.name-input-area label {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: 12px;
  color: var(--neon-green);
  letter-spacing: 2px;
}

.name-input-area input {
  background: var(--panel);
  border: 2px solid var(--neon-blue);
  color: var(--neon-blue);
  font-family: 'Share Tech Mono', 'MonoFallback', 'Courier New', monospace;
  font-size: 20px;
  padding: 12px 20px;
  width: 100%;
  text-align: center;
  outline: none;
  box-shadow: 0 0 15px rgba(0,240,255,0.3);
}
.name-input-area input:focus {
  border-color: var(--neon-yellow);
  box-shadow: 0 0 25px rgba(255,238,0,0.4);
}

/* BUTTONS */
.btn {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: clamp(8px, 2.5vw, 14px);
  padding: 14px 28px;
  border: none;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.1s;
  position: relative;
}

.btn-primary {
  background: var(--neon-yellow);
  color: #0a0a1a;
  box-shadow: 4px 4px 0 #aa6600, 0 0 20px rgba(255,238,0,0.5);
}
.btn-primary:hover, .btn-primary:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 #aa6600, 0 0 30px rgba(255,238,0,0.7);
}

.btn-secondary {
  background: transparent;
  color: var(--neon-blue);
  border: 2px solid var(--neon-blue);
  box-shadow: 3px 3px 0 #006688;
}
.btn-secondary:hover {
  background: rgba(0,240,255,0.1);
}

.btn-green {
  background: var(--neon-green);
  color: #0a0a1a;
  box-shadow: 4px 4px 0 #006633;
  font-size: clamp(10px, 3vw, 16px);
  padding: 16px 32px;
}

.btn-red {
  background: transparent;
  color: var(--neon-red);
  border: 2px solid var(--neon-red);
  font-size: clamp(8px, 2vw, 12px);
  padding: 10px 20px;
}

.btn-orange {
  background: var(--neon-orange);
  color: #0a0a1a;
  box-shadow: 4px 4px 0 #883300;
  font-size: clamp(8px, 2vw, 11px);
  padding: 12px 20px;
}

/* STAGE SELECT */
#screen-stages {
  padding-top: 30px;
}

.stages-title {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(14px, 4vw, 24px);
  color: var(--neon-yellow);
  text-align: center;
  margin-bottom: 8px;
  text-shadow: 0 0 10px var(--neon-yellow);
}

.player-tag {
  font-size: 12px;
  color: var(--neon-green);
  text-align: center;
  margin-bottom: 30px;
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
}

.stage-grid {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
  max-width: 500px;
}

.stage-card {
  background: var(--panel);
  border: 2px solid var(--border);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.stage-card.unlocked {
  border-color: var(--neon-blue);
  box-shadow: 0 0 15px rgba(0,240,255,0.2);
}
.stage-card.unlocked:hover {
  border-color: var(--neon-yellow);
  box-shadow: 0 0 25px rgba(255,238,0,0.3);
  transform: translateX(4px);
}

.stage-card.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.stage-card.completed {
  border-color: var(--neon-green);
  box-shadow: 0 0 15px rgba(0,255,136,0.2);
}

.stage-num {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 10px;
  color: var(--dim);
  margin-bottom: 6px;
}

.stage-name {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(14px, 4vw, 20px);
  font-weight: 900;
  margin-bottom: 6px;
}

.stage-desc {
  font-size: 14px;
  color: var(--dim);
  line-height: 1.7;
}

.stage-lock {
  position: absolute;
  right: 15px;
  bottom: 12px;
  font-size: 16px;
  color: var(--neon-green);
}

.stage-score-badge {
  position: absolute;
  right: 15px;
  top: 15px;
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 9px;
  color: var(--neon-green);
  text-align: right;
}

/* GAME HEADER */
.game-header {
  width: 100%;
  max-width: 700px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  margin-bottom: 15px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 8px;
}

.game-stage-label {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 8px;
  color: var(--neon-orange);
}

.score-display {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif;
  font-size: 24px;
  color: var(--neon-yellow);
  font-weight: 900;
  text-shadow: 0 0 12px var(--neon-yellow), 0 0 24px rgba(255,238,0,0.4);
  letter-spacing: 1px;
  transition: transform 0.15s ease, text-shadow 0.15s ease;
}
.score-display.score-bump {
  transform: scale(1.25);
  text-shadow: 0 0 25px var(--neon-yellow), 0 0 50px var(--neon-orange), 0 0 80px rgba(255,238,0,0.5);
}

.round-display {
  font-size: 13px;
  color: var(--dim);
}

/* PROGRESS BAR */
.progress-bar-container {
  width: 100%;
  max-width: 700px;
  height: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  margin-bottom: 20px;
  position: relative;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
  transition: width 0.5s ease;
  box-shadow: 0 0 10px var(--neon-blue);
}

.progress-label {
  position: absolute;
  right: 0;
  top: -18px;
  font-size: 9px;
  color: var(--dim);
}

/* TIMER */
.timer-display {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: 14px;
  color: var(--neon-pink);
  min-width: 60px;
  text-align: right;
}
.timer-display.warning { color: var(--neon-red); animation: timerFlash 0.5s infinite; }
@keyframes timerFlash { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* EXPRESSION DISPLAY */
.expression-display {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(20px, 5vw, 36px);
  font-weight: 700;
  color: var(--text);
  text-align: center;
  padding: 20px;
  background: var(--panel);
  border: 2px solid var(--border);
  width: 100%;
  max-width: 700px;
  margin-bottom: 20px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
}

/* TERM CHIPS */
.term-chip {
  display: inline-flex;
  align-items: center;
  background: #1e1e4a;
  border: 2px solid var(--neon-blue);
  color: var(--neon-blue);
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(14px, 3.5vw, 22px);
  font-weight: 700;
  padding: 8px 16px;
  cursor: grab;
  transition: all 0.2s;
  position: relative;
  margin: 4px;
  touch-action: none;
}

.term-chip:hover { border-color: var(--neon-yellow); color: var(--neon-yellow); transform: scale(1.05); }
.term-chip.dragging { opacity: 0.5; transform: scale(0.95); }
.term-chip.selected { border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 20px rgba(255,238,0,0.6); transform: scale(1.08); }
.term-chip.sorted { opacity: 0.3; cursor: default; border-style: dashed; }

.term-chip sup {
  font-size: 0.65em;
  color: var(--exp-color);
  font-weight: 700;
  text-shadow: 0 0 8px var(--exp-color);
  line-height: 0;
  vertical-align: super;
}

/* BUCKETS */
.buckets-container {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 700px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.bucket {
  flex: 1;
  min-width: 120px;
  min-height: 120px;
  background: var(--panel);
  border: 3px dashed var(--border);
  padding: 12px;
  text-align: center;
  transition: all 0.2s;
  position: relative;
  cursor: pointer;
}

.bucket.drag-over, .bucket.tap-ready {
  border-color: var(--neon-yellow);
  background: rgba(255,238,0,0.05);
  box-shadow: 0 0 20px rgba(255,238,0,0.3);
}

.bucket-label {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 9px;
  color: var(--neon-orange);
  margin-bottom: 10px;
  display: block;
}

.bucket-contents {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: center;
  min-height: 50px;
}

.bucket-term {
  background: rgba(0,255,136,0.15);
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: 12px;
  padding: 4px 8px;
}

.bucket-term sup {
  font-size: 0.7em;
  color: var(--exp-color);
  vertical-align: super;
  line-height: 0;
}

/* FEEDBACK OVERLAY */
.feedback-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.feedback-card {
  background: var(--panel);
  border: 3px solid var(--neon-blue);
  padding: 30px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,240,255,0.3);
}

.feedback-card.correct { border-color: var(--neon-green); box-shadow: 0 0 40px rgba(0,255,136,0.4); }
.feedback-card.wrong { border-color: var(--neon-red); box-shadow: 0 0 40px rgba(255,34,68,0.4); }

.feedback-icon { font-size: 48px; margin-bottom: 15px; display: block; }

.feedback-title {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 14px;
  margin-bottom: 15px;
}
.feedback-title.correct { color: var(--neon-green); }
.feedback-title.wrong { color: var(--neon-red); }

.feedback-explain {
  font-size: 18px;
  line-height: 2;
  color: var(--text);
  margin-bottom: 20px;
}

.feedback-term-highlight {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: 18px;
  font-weight: 700;
  padding: 8px 16px;
  background: rgba(255,238,0,0.1);
  border: 1px solid var(--neon-yellow);
  display: inline-block;
  margin: 8px 0;
}

.feedback-term-highlight sup {
  font-size: 0.65em;
  color: var(--exp-color);
  vertical-align: super;
  line-height: 0;
}

.feedback-more {
  font-size: 15px;
  color: var(--neon-blue);
  line-height: 1.9;
  margin-bottom: 20px;
  border-top: 1px solid var(--border);
  padding-top: 15px;
  display: none;
}

.feedback-more.visible { display: block; }

.feedback-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.spot-tappable {
  transition: all 0.15s ease;
}
.spot-tappable:hover {
  border-color: var(--neon-blue) !important;
  color: var(--neon-blue) !important;
  transform: scale(1.05);
  cursor: pointer;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  15%      { transform: translateX(-8px) rotate(-1deg); }
  30%      { transform: translateX(8px) rotate(1deg); }
  45%      { transform: translateX(-6px); }
  60%      { transform: translateX(6px); }
  75%      { transform: translateX(-3px); }
  90%      { transform: translateX(3px); }
}
@keyframes wrongPulse {
  0%   { box-shadow: 0 0 0 rgba(255,34,68,0); }
  40%  { box-shadow: 0 0 30px rgba(255,34,68,0.8); }
  100% { box-shadow: 0 0 0 rgba(255,34,68,0); }
}
@keyframes correctReveal {
  0%   { box-shadow: 0 0 0 rgba(0,255,136,0); }
  40%  { box-shadow: 0 0 35px rgba(0,255,136,0.9), 0 0 60px rgba(0,255,136,0.4); }
  100% { box-shadow: 0 0 15px rgba(0,255,136,0.5); }
}
.shake {
  animation: shake 0.45s ease-out, wrongPulse 0.45s ease-out;
}
.correct-reveal {
  animation: correctReveal 0.6s ease-out forwards;
  border-color: var(--neon-green) !important;
  color: var(--neon-green) !important;
  background: rgba(0,255,136,0.12) !important;
}
@keyframes correctFlash {
  0% { background: rgba(0,255,136,0.3); }
  100% { background: transparent; }
}
@keyframes wrongFlash {
  0% { background: rgba(255,34,68,0.3); }
  50% { background: rgba(255,34,68,0.5); }
  100% { background: transparent; }
}
@keyframes bounceBack {
  0% { transform: translateX(20px); opacity: 0.5; }
  60% { transform: translateX(-5px); }
  100% { transform: translateX(0); opacity: 1; }
}

.flash-correct { animation: correctFlash 0.6s ease-out; }
.flash-wrong { animation: wrongFlash 0.6s ease-out; }
.bounce-back { animation: bounceBack 0.4s ease-out; }

/* STAGE 2 - BIG TERM DISPLAY */
.big-term-display {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(60px, 15vw, 100px);
  font-weight: 900;
  text-align: center;
  padding: 30px;
  margin: 20px 0;
  background: var(--panel);
  border: 2px solid var(--border);
  width: 100%;
  max-width: 500px;
  line-height: 1.1;
  position: relative;
}

.big-term-display .coeff { color: var(--coeff-color); text-shadow: 0 0 15px var(--coeff-color); }
.big-term-display .var { color: var(--var-color); text-shadow: 0 0 15px var(--var-color); }
.big-term-display .exp {
  font-size: 0.55em;
  color: var(--exp-color);
  text-shadow: 0 0 15px var(--exp-color);
  vertical-align: super;
  line-height: 0;
  animation: expPulse 1.5s ease-in-out infinite;
}
@keyframes expPulse {
  0%,100% { text-shadow: 0 0 15px var(--exp-color); }
  50% { text-shadow: 0 0 30px var(--exp-color), 0 0 60px var(--exp-color); }
}

.choices-container {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  width: 100%;
  max-width: 500px;
  margin-bottom: 20px;
}

.choice-btn {
  flex: 1;
  min-width: 100px;
  padding: 20px 10px;
  background: var(--panel);
  border: 3px solid var(--border);
  color: var(--text);
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(16px, 4vw, 24px);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.choice-btn:hover, .choice-btn:active {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 20px rgba(255,238,0,0.4);
  transform: scale(1.05);
}
.choice-btn.correct-ans { border-color: var(--neon-green); color: var(--neon-green); background: rgba(0,255,136,0.1); }
.choice-btn.wrong-ans { border-color: var(--neon-red); color: var(--neon-red); background: rgba(255,34,68,0.1); }

.choice-btn sup { font-size: 0.6em; color: var(--exp-color); vertical-align: super; line-height: 0; }

.ask-label {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: clamp(8px, 2.5vw, 12px);
  color: var(--neon-pink);
  text-align: center;
  margin-bottom: 15px;
  text-shadow: 0 0 10px var(--neon-pink);
}

/* STAGE 3 - SMART KEYPAD */
.simplify-question {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(22px, 6vw, 42px);
  font-weight: 900;
  color: var(--text);
  text-align: center;
  padding: 25px;
  background: var(--panel);
  border: 2px solid var(--border);
  width: 100%;
  max-width: 600px;
  margin-bottom: 15px;
}

.simplify-question sup { font-size: 0.55em; color: var(--exp-color); vertical-align: super; line-height: 0; }

.answer-display {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(20px, 5vw, 32px);
  font-weight: 700;
  color: var(--neon-yellow);
  text-align: center;
  padding: 15px 25px;
  background: var(--panel);
  border: 3px solid var(--neon-yellow);
  width: 100%;
  max-width: 400px;
  min-height: 65px;
  margin-bottom: 15px;
  box-shadow: 0 0 20px rgba(255,238,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.answer-display sup { font-size: 0.55em; color: var(--exp-color); vertical-align: super; line-height: 0; }

.keypad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  width: 100%;
  max-width: 400px;
  margin-bottom: 10px;
}

.key {
  padding: 14px 6px;
  background: var(--panel);
  border: 2px solid var(--border);
  color: var(--text);
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(12px, 3vw, 16px);
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.1s;
  touch-action: manipulation;
}
.key:hover, .key:active {
  background: rgba(0,240,255,0.15);
  border-color: var(--neon-blue);
  color: var(--neon-blue);
  transform: scale(0.96);
}
.key.key-var { color: var(--var-color); border-color: rgba(0,240,255,0.3); }
.key.key-special {
  background: rgba(255,0,170,0.1);
  border-color: var(--neon-pink);
  color: var(--neon-pink);
  font-size: 9px;
}
.key.key-submit {
  grid-column: span 2;
  background: var(--neon-green);
  color: #0a0a1a;
  border-color: var(--neon-green);
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 9px;
}
.key.key-delete {
  background: rgba(255,34,68,0.15);
  border-color: var(--neon-red);
  color: var(--neon-red);
}

/* X VISUALIZATION */
.x-viz-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  background: var(--panel);
  border: 2px solid var(--border);
  width: 100%;
  max-width: 500px;
  margin-bottom: 15px;
}

.x-viz-title {
  font-size: 14px;
  color: var(--dim);
  margin-bottom: 15px;
  text-align: center;
}

.x-scatter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 15px;
}

.x-single {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: 28px;
  font-weight: 900;
  color: var(--var-color);
  text-shadow: 0 0 10px var(--var-color);
  animation: scatter 0.5s ease-out forwards;
  opacity: 0;
}

@keyframes scatter {
  0% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  60% { opacity: 1; }
  100% { transform: translate(0,0) scale(1); opacity: 1; }
}

.x-collected {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: 36px;
  font-weight: 900;
  color: var(--neon-yellow);
  text-shadow: 0 0 20px var(--neon-yellow);
  opacity: 0;
  transition: opacity 0.5s;
}
.x-collected.show { opacity: 1; }

/* SPOT THE ERROR */
.spot-error-container {
  width: 100%;
  max-width: 600px;
  margin-bottom: 15px;
}

.spot-boss-label {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 10px;
  color: var(--neon-pink);
  text-align: center;
  margin-bottom: 15px;
  text-shadow: 0 0 10px var(--neon-pink);
  animation: titlePulse 1s infinite;
}

.spot-worked {
  background: var(--panel);
  border: 2px solid var(--border);
  padding: 20px;
  margin-bottom: 15px;
}

.spot-worked-title {
  font-size: 14px;
  color: var(--dim);
  margin-bottom: 12px;
}

.spot-step {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(14px, 3.5vw, 18px);
  padding: 12px 16px;
  margin-bottom: 6px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.spot-step:hover { border-color: var(--neon-pink); color: var(--neon-pink); }
.spot-step.selected-error { border-color: var(--neon-red); background: rgba(255,34,68,0.1); color: var(--neon-red); }
.spot-step.correct-error { border-color: var(--neon-green); background: rgba(0,255,136,0.1); color: var(--neon-green); }
.spot-step.no-error { border-color: var(--neon-blue); }

.spot-step-num {
  font-size: 13px;
  color: var(--dim);
  min-width: 20px;
}
.spot-step sup { font-size: 0.6em; color: var(--exp-color); vertical-align: super; line-height: 0; }

.spot-instruction {
  font-size: 15px;
  color: var(--neon-pink);
  text-align: center;
  margin-bottom: 12px;
}

/* INTRO ANIMATION */
.intro-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-y: auto;
  z-index: 2000;
  padding: 40px 30px 30px;
}

.intro-step {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
  max-width: 500px;
  width: 100%;
}
.intro-step.active { display: flex; }

.intro-expression {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(24px, 6vw, 48px);
  font-weight: 900;
}

.intro-arrow {
  font-size: 40px;
  color: var(--neon-yellow);
  animation: bounce 1s infinite;
}
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

.intro-result {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(28px, 7vw, 56px);
  font-weight: 900;
  color: var(--neon-green);
  text-shadow: 0 0 20px var(--neon-green);
}

/* FINAL SCREEN */
#screen-final {
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a3a0a 0%, #0a0a1a 70%);
}

.final-title {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: clamp(14px, 4vw, 28px);
  color: var(--neon-green);
  text-shadow: 0 0 20px var(--neon-green);
  text-align: center;
  margin-bottom: 20px;
}

.final-score-display {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(36px, 10vw, 72px);
  font-weight: 900;
  color: var(--neon-yellow);
  text-shadow: 0 0 30px var(--neon-yellow);
  text-align: center;
  margin: 20px 0;
}

.final-name-score {
  background: var(--panel);
  border: 2px solid var(--neon-green);
  padding: 20px 30px;
  text-align: center;
  width: 100%;
  max-width: 400px;
  margin-bottom: 20px;
}

.final-name {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(16px, 4vw, 24px);
  font-weight: 700;
  color: var(--neon-blue);
  margin-bottom: 8px;
}

.final-score-label {
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 5px;
}

.final-score-number {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: clamp(28px, 7vw, 48px);
  font-weight: 900;
  color: var(--neon-yellow);
}

.final-code-box {
  background: var(--panel);
  border: 2px solid var(--neon-orange);
  padding: 20px;
  text-align: center;
  width: 100%;
  max-width: 400px;
  margin-bottom: 25px;
}

.final-code-label {
  font-size: 10px;
  color: var(--dim);
  margin-bottom: 8px;
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
}

.final-code {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: clamp(14px, 4vw, 22px);
  color: var(--neon-orange);
  text-shadow: 0 0 15px var(--neon-orange);
  letter-spacing: 4px;
}

.screenshot-hint {
  font-size: 11px;
  color: var(--neon-pink);
  text-align: center;
  margin-bottom: 20px;
  padding: 10px;
  border: 1px dashed var(--neon-pink);
  max-width: 400px;
  line-height: 1.8;
}

/* TEACHER DASHBOARD */
.teacher-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
  padding: 20px;
}

.teacher-panel {
  background: #0a0a2a;
  border: 3px solid var(--neon-orange);
  padding: 30px;
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 50px rgba(255,102,0,0.4);

.teacher-title {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 12px;
  color: var(--neon-orange);
  text-align: center;
  margin-bottom: 25px;

}

.teacher-section {
  margin-bottom: 25px;
  border-top: 1px solid var(--border);

}

.teacher-section-title {
  font-family: 'Orbitron', 'SansFallback', 'Arial Black', sans-serif, 'SansFallback', 'Arial Black', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--neon-yellow);

}

.code-table {

.code-table td, .code-table th {

.decoder-area {

.decoder-area input {

.decoder-result {

  border: 1px solid var(--neon-green);

  font-size: 13px;
  line-height: 2;
  min-height: 50px;
  color: var(--neon-green);
}

/* CHALLENGE BADGE */
.challenge-prompt {
  background: rgba(255,102,0,0.1);
  border: 2px solid var(--neon-orange);
  padding: 15px 20px;
  text-align: center;
  width: 100%;
  max-width: 500px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.2s;
}
.challenge-prompt:hover { background: rgba(255,102,0,0.2); transform: scale(1.02); }

.challenge-label {
  font-family: 'Press Start 2P', 'PixelFallback', monospace, 'PixelFallback', monospace;
  font-size: 9px;
  color: var(--neon-orange);
  margin-bottom: 6px;
}

.challenge-text {
  font-size: 12px;

<script>
const SoundEngine = (() => {
  let ctx = null;
  let muted = false;

  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    // Resume if suspended (browser autoplay policy)
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, type, vol, attack, sustain, decay) {
    const c = getCtx(); if (!c || muted) return;
    try {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.connect(gain); gain.connect(c.destination);
      osc.type = type; osc.frequency.setValueAtTime(freq, c.currentTime);
      gain.gain.setValueAtTime(0, c.currentTime);
      gain.gain.linearRampToValueAtTime(vol, c.currentTime + attack);
      gain.gain.setValueAtTime(vol, c.currentTime + attack + sustain);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + attack + sustain + decay);
      osc.start(c.currentTime);
      osc.stop(c.currentTime + attack + sustain + decay + 0.05);
    } catch(e) {}
  }

// ============================================================
// ALGEBRA CORE
// A term is {c, k}: c = coefficient (whole number), k = monomial key.

// Read what a student typed on the keypad.
// Returns {ok:false, why} if it cannot be read, or {ok:true, map, simplified, leadNeg, oneWritten, tip}.
function parseAnswer(raw) {

  if (!parts || parts.join('') !== s) return { ok: false, why: 'Your answer has a + or − sign with nothing after it. Finish your answer, or delete the extra sign.' };

// ============================================================
// THE WARS — named mistakes, so a mistake gets called by its name
// ============================================================
const WARS = {
  1: { name: 'Growing the power', short: 'War 1', line: 'Adding or taking away like terms never changes the power. 3x + 5x = 8x, not 8x². Think: 3 mangoes + 5 mangoes = 8 mangoes, not 8 mangoes².' },
  2: { name: 'Joining unlike terms', short: 'War 2', line: 'Only like terms can be collected. A term with a variable and a plain number are unlike, and so are terms with different variables. 7x + 2 stays as 7x + 2.' },
  3: { name: 'Dropping the variable', short: 'War 3', line: 'The variable does not disappear. You collected x\'s, so you still have x\'s at the end. 4x + 3x = 7x, not 7.' },
  4: { name: 'The half-multiplied bracket', short: 'War 4', line: 'The number outside the bracket multiplies EVERY term inside. 3(x + 4) = 3x + 12, not 3x + 4.' },
  5: { name: 'Stuck-together substitution', short: 'War 5', line: 'A number next to a letter means multiply. If x = 3, then 2x = 2 × 3 = 6. It is not 23.' },
};
const warTag = n => `<span class="vocab-tag">⚔️ WAR ${n}</span>`;

// Work out what went wrong with a typed algebra answer.
function diagnoseExpr(q, st) {
  for (const t of (q.traps || [])) if (t.map && mapEq(st.map, t.map)) return { war: t.war || 0, msg: t.msg };
  const exp = q.cannot ? q.exprMap : q.answer;
  const eKeys = Object.keys(exp), sKeys = Object.keys(st.map);
  const eVar = eKeys.filter(k => k);
  const missing = eVar.filter(k => !st.map.hasOwnProperty(k) && !sKeys.some(sk => sk && keyLetters(sk) === keyLetters(k)));
  // War 2 first: unlike terms were joined into fewer terms with the same total
  if (sKeys.length < eKeys.length && mapSum(st.map) === mapSum(exp)) {
    return { war: 2, msg: WARS[2].line + (missing.length && st.map[''] ? ' You also lost the variable, which is War 3.' : '') };
  }
  // War 1: a term has the right letters but a different power
  const w1 = sKeys.some(sk => sk && !exp.hasOwnProperty(sk) && eKeys.some(ek => ek && keyLetters(ek) === keyLetters(sk) && ek !== sk));
  if (w1 && q.war1 !== false) return { war: 1, msg: WARS[1].line };
  if (missing.length && st.map.hasOwnProperty('') && sKeys.length <= eKeys.length) return { war: 3, msg: WARS[3].line };
  if (!st.simplified && mapEq(st.map, exp)) return { war: 0, msg: 'Nearly there. Your answer is worth the same, but it is not finished. ' + (st.tip || 'You can still collect like terms.') };
  if (sKeys.length === eKeys.length && sKeys.every(k => exp.hasOwnProperty(k))) return { war: 0, msg: 'You kept the right terms, but a number is wrong. Check your adding and taking away again.' };
  return { war: 0, msg: '' };
}

// ============================================================
// QUESTION MAKERS — WORLD 1: MEET THE TERMS
// ============================================================
const cf = () => ri(2, 12);

function opt(h, ok, why, war) { return { h, ok: !!ok, why: why || '', war: war || 0 }; }
function choiceQ(o) { return Object.assign({ type: 'choice' }, o, { options: shuffle(o.options) }); }

// Build a + only expression of 3–6 terms with 1–3 variables and constants.
function plusExpr(opts) {
  opts = opts || {};

  const lets = shuffle(opts.pool || L_ANY).slice(0, nv);
  const terms = [];
  lets.forEach(l => { const n = nv === 1 ? pick([2, 2, 3]) : pick([1, 1, 2]); for (let i = 0; i < n; i++) terms.push({ s: 1, c: cf1(), k: l }); });
  const nc = opts.noConst ? 0 : pick([1, 1, 2]);
  for (let i = 0; i < nc; i++) terms.push({ s: 1, c: ri(1, 15), k: '' });
  let list = shuffle(terms).slice(0, 6);
  if (!opts.noConst && !list.some(t => !t.k)) list[list.length - 1] = { s: 1, c: ri(1, 15), k: '' };
  if (!list.some(t => t.k)) list[0] = { s: 1, c: cf(), k: lets[0] };

// Stage 1.1 — Term Sorter
function genSort() {
  const { list, lets } = plusExpr();

  if (Math.random() < 0.35) { const decoy = pick(L_ANY.filter(l => !lets.includes(l))); buckets.splice(ri(0, buckets.length), 0, { id: decoy, label: decoy + '-terms' }); }
  buckets.push({ id: '#', label: 'numbers (constants)' });

    type: 'sort', ask: 'SORT EACH TERM INTO THE CORRECT BUCKET', big: listHTML(list),
    terms: list.map((t, i) => ({ id: 't' + i, h: termHTML(t.c, t.k), b: t.k || '#', c: t.c, k: t.k })),

  const extra = term.c === 1 ? ` <b>${term.h}</b> means 1${term.k}, so it is still a ${term.k}-term.` : '';
  if (dropped === '#') return `<b>${term.h}</b> has the <span class="vocab-tag">variable</span> ${term.k}, so it is not a constant. It belongs with the ${term.k}-terms.${extra}`;

const STAGE = (w, s) => WORLDS[w - 1].stages[s - 1];
function makeRun(w, s, speed) {
  const S = STAGE(w, s); const qs = [];
  let bag = [];
  const n = speed ? 40 : QUESTIONS_PER_RUN - 2;
  for (let i = 0; i < n; i++) { if (!bag.length) bag = shuffle(S.gens); qs.push(bag.pop()()); }
  if (!speed) { qs.push(S.boss[0](), S.boss[S.boss.length > 1 ? 1 : 0]()); }
  return qs;
}

// ============================================================
// SAVING — progress stays on this device and is never wiped by finishing
// ============================================================
const SAVE_KEY = 'termwars2-save';
const mem = {};
function freshSave() { return { v: 2, name: '', cls: '', stages: {}, opened: {}, teacherOpen: false, howSeen: {} }; }
function loadSave() { try { const r = localStorage.getItem(SAVE_KEY); if (r) { const o = JSON.parse(r); if (o && o.v === 2) return Object.assign(freshSave(), o); } } catch (e) { } return mem.save || null; }
let save = (typeof localStorage !== 'undefined' && loadSave()) || freshSave();
function writeSave() { mem.save = save; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }
const rec = (w, s) => save.stages[w + '.' + s] || { best: 0, passed: false, plays: 0, wars: {}, speed: 0 };
const worldPassed = w => WORLDS[w - 1].stages.every((_, j) => rec(w, j + 1).passed);
function worldOpen(w) {
  if (save.teacherOpen || w === 1) return true;
  if (!worldPassed(1)) return false;
  return !WORLDS[w - 1].locked || !!save.opened[w];
}
const stageOpen = (w, s) => worldOpen(w) && (s === 1 || save.teacherOpen || rec(w, s - 1).passed);

// ============================================================
// PLAYING A RUN
// One rule everywhere: one try per question. Right the first time = it counts.
// ============================================================
let P = null;
function startRun(w, s, speed, skipHow) {
  const key = w + '.' + s;
  if (!speed && !skipHow && !save.howSeen[key]) { save.howSeen[key] = 1; writeSave(); showHowto(w, s, true); return; }
  clearInterval(P && P.timer);
  P = { w, s, qs: makeRun(w, s, !!speed), i: 0, first: 0, res: [], wars: {}, speed: !!speed, timeLeft: SPEED_SECONDS, timer: null, done: false };
  showScreen('screen-play');
  if (speed) {
    $('play-timer').textContent = SPEED_SECONDS + 's'; $('play-timer').className = 'timer-display';
    P.timer = setInterval(() => {
      P.timeLeft--; $('play-timer').textContent = P.timeLeft + 's'; updateHeader();
      if (P.timeLeft === 10) SoundEngine.play('timerWarn');
      if (P.timeLeft <= 10) $('play-timer').className = 'timer-display warning';
      if (P.timeLeft <= 0) { clearInterval(P.timer); endSpeed(); }
    }, 1000);
  } else { $('play-timer').textContent = ''; }
  renderQ();
}
function confirmQuit() {
  showFeedback({ correct: false, silent: true, icon: '⌂', title: 'LEAVE THIS RUN?', explain: 'This run will not count. Your best scores are kept.', button: 'YES, LEAVE',
    callback: () => { clearInterval(P && P.timer); if (P) P.done = true; showStages(P.w); } });
  $('btn-more').className = 'btn btn-red'; $('btn-more').textContent = 'KEEP PLAYING'; $('btn-more').onclick = () => { feedbackCallback = null; $('feedback-overlay').classList.add('hidden'); $('btn-more').onclick = showMoreExplain; $('btn-more').textContent = 'SHOW ME MORE'; };
}
function updateHeader() {
  const S = STAGE(P.w, P.s);
  $('play-label').textContent = `WORLD ${P.w} — ${S.name}`;
  $('play-round').textContent = P.speed ? '⚡ SPEED ROUND — as many as you can' : `Question ${P.i + 1} of ${P.qs.length}`;
  $('play-score').textContent = P.speed ? `${P.first} ✓` : `✓ ${P.first}`;
  $('play-progress').style.width = P.speed ? ((SPEED_SECONDS - P.timeLeft) / SPEED_SECONDS * 100) + '%' : ((P.i) / P.qs.length * 100) + '%';
}
function renderQ() {
  const q = P.qs[P.i];
  updateHeader();
  $('play-boss').classList.toggle('hidden', !q.boss);
  if (q.boss) SoundEngine.play('bossRound');
  const area = $('play-area'); area.innerHTML = '';
  P.locked = false; P.buf = ''; P.mistakes = 0;
  ({ choice: renderChoice, type: renderType, sort: renderSort, spot: renderSpot, fault: renderFault })[q.type](q, area);
  window.scrollTo(0, 0);
}
function answered(ok, war) {
  P.res[P.i] = ok;
  if (ok) P.first++; else if (war) P.wars[war] = (P.wars[war] || 0) + 1;
  updateHeader();
}
function nextQ() {
  if (P.done) return;
  P.i++;
  if (P.speed) { if (P.i >= P.qs.length) P.qs = P.qs.concat(makeRun(P.w, P.s, true)); renderQ(); return; }
  if (P.i >= P.qs.length) finishRun(); else renderQ();
}
function goodFlash(x, y) { SoundEngine.play('correct'); showPointsPopup('+1', x || window.innerWidth / 2, y || window.innerHeight / 2); }
function wrongCard(explain, more) {
  if (P.speed) { SoundEngine.play('wrong'); showToast('✗ ' + explain.replace(/<br>/g, ' ').replace(/<(?!sup|\/sup)[^>]+>/g, '').slice(0, 160), true); setTimeout(nextQ, 900); return; }
  showFeedback({ correct: false, explain, more, callback: nextQ });
}

// ---------- multiple choice ----------
function renderChoice(q, area) {
  if (q.context) area.appendChild(el('div', 'q-context', q.context));
  area.appendChild(el('div', 'q-ask', q.ask));
  if (q.big) area.appendChild(el('div', 'q-big', q.big));
  const box = el('div', 'choices-container' + (q.wide ? ' choices-col' : ''));
  const right = q.options.find(o => o.ok);
  q.options.forEach(o => {
    const b = el('button', 'choice-btn' + (q.wide ? ' wide' : ''), o.h);
    b.onclick = () => {
      if (P.locked) return; P.locked = true;
      box.querySelectorAll('button').forEach(x => { x.disabled = true; });
      if (o.ok) {
        b.classList.add('correct-ans'); answered(true);
        const r = b.getBoundingClientRect(); goodFlash(r.left + r.width / 2, r.top);
        if (q.boss && !P.speed) showFeedback({ correct: true, silent: true, explain: (o.why ? o.why + '<br><br>' : '') + (q.explain || ''), callback: nextQ });
        else setTimeout(nextQ, 650);
      } else {
        b.classList.add('wrong-ans');
        box.querySelectorAll('button').forEach((x, i) => { if (q.options[i].ok) x.classList.add('correct-ans'); });
        answered(false, o.war);
        wrongCard(`${o.war ? warTag(o.war) + '<br>' : ''}${o.why}<br><br>The answer is <b>${right.h}</b>.`, q.explain);
      }
    };
    box.appendChild(b);
  });
  area.appendChild(box);
}

// ---------- typed answers on the keypad ----------
function renderType(q, area) {
  area.appendChild(el('div', 'q-ask', q.ask));
  area.appendChild(el('div', 'simplify-question', q.big));
  const disp = el('div', 'answer-display', '_'); disp.id = 'answer-display'; area.appendChild(disp);
  const pad = el('div', 'keypad' + (q.mode === 'num' ? '' : ' k6'));
  let keys;
  if (q.mode === 'num') keys = ['7', '8', '9', '⌫', '4', '5', '6', '0', '1', '2', '3', 'SUBMIT'].map(v => ({ v }));
  else {
    keys = ['7', '8', '9', 'x', 'y', '⌫', '4', '5', '6', 'a', 'b', '+', '1', '2', '3', 'm', 'n', MINUS, '0', 'p', 'k'].map(v => ({ v }));
    let used = 3;

function showBuf() { const d = $('answer-display'); if (!d) return; d.innerHTML = P.buf === 'CANNOT' ? 'CANNOT SIMPLIFY' : (P.buf ? esc(P.buf).replace(/²/g, '<sup>2</sup>') : '_'); }

document.addEventListener('keydown', e => {

// ---------- sorting terms into buckets ----------

// ---------- boss: spot the wrongly sorted terms ----------
function renderSpot(q, area) {
  area.appendChild(el('div', 'q-ask', q.ask));
  area.appendChild(el('div', 'expression-display', q.big));
  const bc = el('div', 'buckets-container');
  const sel = new Set(); const items = [];

    const be = el('div', 'bucket', `<span class="bucket-label">${b.label.toUpperCase()}</span>`); be.style.borderStyle = 'solid'; be.style.cursor = 'default';
    const inner = el('div', 'bucket-contents');

// ---------- boss: find the first wrong line, then name the fault ----------

        b.onclick = () => {
          if (P.locked) return; P.locked = true;
          box.querySelectorAll('button').forEach((x, i) => { x.disabled = true; if (q.names[i].ok) x.classList.add('correct-ans'); });
          const ok = P.faultFirst && o.ok;
          answered(ok, ok ? 0 : (q.war || o.war));
          const right = q.names.find(n => n.ok);
          if (o.ok) { b.classList.add('correct-ans'); goodFlash(); showFeedback({ correct: true, silent: true, title: ok ? 'CORRECT!' : 'RIGHT THIS TIME', explain: (ok ? '' : 'You named the fault, but the first line was not right, so this one does not count.<br><br>') + (o.why || right.h), callback: nextQ }); }
          else { b.classList.add('wrong-ans'); wrongCard(`${o.why}<br><br>The fault is: <b>${right.h}</b>`, q.explain); }
        };
        box.appendChild(b);
      });

    else {
      P.faultFirst = false;

      showFeedback({ correct: false, explain: `${q.lines[P.faultPick].why || 'That line is fine.'}<br><br>The first wrong line is <b>Line ${q.bad + 1}</b> (shown in green).`, button: 'NEXT: NAME THE FAULT ▶', callback: toStep2 });
    }
  };
  step.appendChild(conf);
}

// THE TICKET — a code sealed with the student's name, class and results
// ============================================================
const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z]/g, '');
const normResult = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function fnv(str, seed) { let h = seed >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function sealCode(name, cls, result) {
  const s = TICKET_SALT + '|' + normName(name) + '|' + String(cls || '').toUpperCase() + '|' + normResult(result);
  const h = fnv(s, 2166136261), g = fnv(s.split('').reverse().join(''), 374761393); let out = '';
  for (let i = 0; i < 6; i++) { const v = i < 3 ? h : g; out += CODE_ABC[Math.floor(v / Math.pow(31, i % 3)) % 31]; }
  return out.slice(0, 3) + '-' + out.slice(3);
}
const cleanCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function checkSeal(name, cls, result, code) {
  const c = cleanCode(code); if (!normName(name) || c.length !== 6) return { ok: false };
  if (cleanCode(sealCode(name, cls, result)) === c) return { ok: true, cls: String(cls).toUpperCase() };
  for (const k of CLASSES) if (cleanCode(sealCode(name, k, result)) === c) return { ok: true, cls: k, classMismatch: true };
  return { ok: false };
}
function totalWars() { const t = {}; Object.values(save.stages).forEach(r => Object.keys(r.wars || {}).forEach(k => { t[k] = (t[k] || 0) + r.wars[k]; })); return t; }
function resultText() {
  const parts = [];
  WORLDS.forEach(W => {
    const sc = W.stages.map((_, j) => { const r = rec(W.n, j + 1); return r.plays ? String(r.best) : '-'; });
    if (sc.every(x => x === '-')) return;
    parts.push('W' + W.n + (worldPassed(W.n) ? ' PASS ' : ' ') + sc.join(','));
  });
  const wars = totalWars(); const wt = Object.keys(wars).filter(k => wars[k]).sort().map(k => k + 'x' + wars[k]).join(' ');
  return (parts.join(' | ') || 'Nothing played yet') + (wt ? ' | Wars ' + wt : '');
}
function formLink(name, cls, result, code) {
  if (!FORM_URL) return '';
  const q = ['usp=pp_url']; const add = (k, v) => { if (k) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(v)); };
  add(FORM_FIELDS.name, name); add(FORM_FIELDS.cls, cls); add(FORM_FIELDS.game, GAME_NAME); add(FORM_FIELDS.result, result); add(FORM_FIELDS.code, code);
  return FORM_URL + '?' + q.join('&');
}
function showTicket() {

    <div class="ticket-lines" id="tk-lines"></div><div class="final-code-label" style="text-align:center;">YOUR TICKET CODE</div><div class="ticket-code" id="tk-code"></div>
    <div class="ticket-btns" id="tk-btns"></div><div id="tk-say"></div>

    <b>If the form does not work</b>, do any one of these: press "Copy my message" and send it to ${TEACHER_NAME} on WhatsApp or by email (${TEACHER_EMAIL}), or take a screenshot of this screen, or write your code in your exercise book and show ${TEACHER_NAME} in class.</div>`;
  const nameIn = $('tk-name'), clsIn = $('tk-class');

    const L = WORLDS.filter(W => W.stages.some((_, j) => rec(W.n, j + 1).plays)).map(W => `<span class="tl-world">World ${W.n} · ${W.name}${worldPassed(W.n) ? ' — PASSED' : ''}</span><br>${W.stages.map((S, j) => { const r = rec(W.n, j + 1); return `&nbsp;&nbsp;Stage ${j + 1}: ${r.plays ? 'best ' + r.best + '/10' + (r.passed ? ' ✓' : '') : 'not played yet'}`; }).join('<br>')}`);
    const w = totalWars(); const ws = Object.keys(w).filter(k => w[k]).map(k => `War ${k} × ${w[k]}`).join(', ');
    return (L.join('<br>') || 'You have not played any stages yet.') + (ws ? `<br><span style="color:var(--neon-pink)">Mistakes in your latest runs: ${ws}</span>` : '');
  };
  const code = () => sealCode(nameIn.value.trim(), clsIn.value, resultText());

  const ready = () => { if (nameIn.value.trim().length < 3) { say('Type your full name first.'); nameIn.focus(); return false; } return true; };
  const btns = $('tk-btns');
  if (FORM_URL) {
    const a = el('a', 'btn btn-primary', '📨 SUBMIT MY TICKET'); a.target = '_blank'; a.rel = 'noopener'; a.href = FORM_URL;
    a.addEventListener('click', e => { if (!ready()) { e.preventDefault(); return; } a.href = formLink(nameIn.value.trim(), clsIn.value, resultText(), code());
      say('The form should open in a new tab with everything filled in. Press <b>Submit</b> on the form. When you see "Your response has been recorded", you are done. If the form did not open, use one of the backup ways below.'); });
    btns.appendChild(a);
  }
  const copy = el('button', 'btn btn-secondary', '📋 COPY MY MESSAGE');
  copy.onclick = async () => { if (!ready()) return; const t = message();
    try { await navigator.clipboard.writeText(t); say(`Copied. Paste it into a WhatsApp message or an email to ${TEACHER_NAME}.`); }
    catch (e) { say(`Copy this message and send it to ${TEACHER_NAME}:<textarea readonly>${esc(t)}</textarea>`); } };
  btns.appendChild(copy);
  const mail = el('a', 'btn btn-secondary', '✉ EMAIL'); mail.target = '_blank'; mail.rel = 'noopener';
  mail.addEventListener('click', e => { if (!ready()) { e.preventDefault(); return; } mail.href = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent('Term Wars ticket: ' + nameIn.value.trim())}&body=${encodeURIComponent(message())}`; });
  mail.href = `mailto:${TEACHER_EMAIL}`; btns.appendChild(mail);
  const keep = () => { save.name = nameIn.value.trim().replace(/\s+/g, ' ') || save.name; save.cls = clsIn.value; writeSave(); draw(); };
  nameIn.addEventListener('input', keep); clsIn.addEventListener('change', keep);
  draw(); showScreen('screen-ticket');
}

// TEACHER PANEL

function parseStamp(s) {
  s = String(s || '').trim(); if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) { const d = new Date(s.replace(' ', 'T')); return isNaN(d) ? null : d; }
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); if (!m) return null;
  const a = +m[1], b = +m[2], y = +m[3], mk = (d, mo) => new Date(y, mo - 1, d, +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  const c = []; if (a <= 12 && b <= 31) c.push(mk(b, a)); if (b <= 12 && a <= 31) c.push(mk(a, b)); if (!c.length) return null;
  const now = Date.now(); c.sort((x, z) => Math.abs(x - now) - Math.abs(z - now)); return c[0];
}
function openTeacher() {
  const p = $('teacher-panel');
  const codes = Object.keys(WORLD_CODES).map(w => `<tr><td>World ${w} — ${WORLDS[w - 1].name}</td><td class="code-val">${WORLD_CODES[w]}</td></tr>`).join('');
  let testLink = '';
  if (FORM_URL) { const tn = 'TEST Mr Legall', tr = 'W1 PASS 9,8 | Wars 2x1'; testLink = formLink(tn, CLASSES[0], tr, sealCode(tn, CLASSES[0], tr)); }
  p.innerHTML = `<div class="teacher-title">⚙ TEACHER PANEL ⚙</div><div style="text-align:right;"><button class="btn btn-secondary" onclick="closeTeacher()">✕ CLOSE</button></div>
  <div class="teacher-section"><div class="teacher-section-title">HOW SCORING WORKS</div>
    <p class="small">Every stage is 10 questions: 8 practice questions and 2 boss rounds (find the fault). Only answers right the FIRST time count. ${PASS_MARK} or more passes the stage. Students can replay as often as they like with new questions, and the game keeps their best score. Speed rounds are just for fun and never count.</p>
    <p class="small">On a ticket, <b>W2 PASS 9,8</b> means World 2 is passed, with a best of 9 on Stage 1 and 8 on Stage 2. A dash means that stage has not been played. <b>Wars 2x3 4x1</b> means 3 War 2 slips and 1 War 4 slip across the student's latest run of each stage.</p></div>
  <div class="teacher-section"><div class="teacher-section-title">CODE WORDS FOR THE LOCKED WORLDS</div>
    <table class="code-table"><tr><th>World</th><th>Code word</th></tr>${codes}</table>
    <p class="small">Say the code word in class on the day you teach that topic. Students type it on the worlds screen. Worlds 2–4 open by themselves once a student passes World 1. To change a code word, edit WORLD_CODES at the top of the file.</p></div>
  <div class="teacher-section"><div class="teacher-section-title">THIS DEVICE (FOR TESTING)</div>
    <button class="btn ${save.teacherOpen ? 'btn-orange' : 'btn-secondary'}" id="t-open">${save.teacherOpen ? '✓ EVERYTHING IS OPEN — TAP TO LOCK AGAIN' : 'OPEN EVERY WORLD AND STAGE'}</button>
    <button class="btn btn-red" id="t-reset">RESET THIS DEVICE</button>
    <p class="small">Opening everything only affects this device. Use it to try any stage without passing the ones before it.</p></div>
  <div class="teacher-section"><div class="teacher-section-title">THE GOOGLE FORM</div>
    ${FORM_URL ? `<p><a class="btn btn-secondary" target="_blank" rel="noopener" href="${testLink}">SEND A TEST TICKET TO THE FORM</a></p><p class="small">This opens the Form filled in with a test student, the way a real ticket would arrive. Submit it, check it reaches your responses, then delete that row.</p>`
      : `<p class="small">The Form is not connected yet, so students will use the backup ways (copy message, email, screenshot). When the Form exists, put its address and entry numbers into FORM_URL and FORM_FIELDS at the top of the file.</p>`}</div>
  <div class="teacher-section"><div class="teacher-section-title">CHECK ONE TICKET</div>
    <div class="row2"><input id="t-name" placeholder="Student name"><select id="t-class">${CLASSES.map(c => `<option>${c}</option>`).join('')}</select></div>
    <input id="t-result" placeholder="Result, exactly as sent (e.g. W1 PASS 9,8 | W2 7,-)" style="margin:6px 0;"><input id="t-code" placeholder="Code, e.g. ABC-234">
    <button class="btn btn-primary" id="t-check">CHECK</button><div id="t-res"></div></div>
  <div class="teacher-section"><div class="teacher-section-title">CHECK MANY TICKETS AT ONCE</div>
    <p class="small">Open the Form responses in Google Sheets. Select the rows from the Timestamp column across to the Code column, copy, and paste them here. Rows from other games are skipped. If a student sent more than one ticket, the latest one is used.</p>
    <textarea id="t-bulk" placeholder="03/11/2026 19:02:11	Kezia Mohammed	1B	Term Wars	W1 PASS 9,8	ABC-234"></textarea>
    <p class="small">Optional: only count tickets sent before this time.</p><input type="datetime-local" id="t-due">
    <button class="btn btn-primary" id="t-bulk-go">CHECK ALL</button><div id="t-bulk-res"></div></div>`;
  $('teacher-overlay').classList.remove('hidden'); $('teacher-overlay').scrollTop = 0;
  $('t-open').onclick = () => { save.teacherOpen = !save.teacherOpen; writeSave(); openTeacher(); showToast(save.teacherOpen ? 'Everything is open on this device.' : 'Locks are back on.'); };
  let resetArmed = false;
  $('t-reset').onclick = () => { if (!resetArmed) { resetArmed = true; $('t-reset').textContent = 'TAP AGAIN TO RESET'; return; } save = freshSave(); writeSave(); closeTeacher(); showScreen('screen-title'); renderTitle(); showToast('This device has been reset.'); };
  $('t-check').onclick = () => {
    const r = checkSeal($('t-name').value, $('t-class').value, $('t-result').value, $('t-code').value);
    $('t-res').innerHTML = `<div class="fb-line ${r.ok ? 'good' : 'bad'}">${r.ok ? 'VALID.' + (r.classMismatch ? ` The code was made for class ${r.cls}, not the class chosen here.` : '') : 'NOT VALID. Check the spelling of the name, the class, and that the result is copied exactly.'}</div>`;
  };
  $('t-bulk-go').onclick = bulkCheck;
}
function closeTeacher() { $('teacher-overlay').classList.add('hidden'); if (document.querySelector('#screen-worlds.active')) showWorlds(); }
function bulkCheck() {
  const out = $('t-bulk-res'); out.innerHTML = '';
  const due = $('t-due').value ? new Date($('t-due').value) : null;
  const lines = $('t-bulk').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const rows = []; let skipped = 0;
  lines.forEach((l, idx) => {
    let cells = (l.includes('\t') ? l.split('\t') : l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/)).map(c => c.trim().replace(/^"|"$/g, ''));
    if (/timestamp|full name/i.test(l)) return;
    let stamp = null; if (cells.length >= 5 && parseStamp(cells[0])) { stamp = parseStamp(cells[0]); cells = cells.slice(1); }
    let name, cls, game, result, code;
    if (cells.length >= 5) [name, cls, game, result, code] = cells; else [name, cls, result, code] = cells;
    if (!name) return;
    if (game && !/term\s*wars/i.test(game)) { skipped++; return; }
    const r = checkSeal(name, cls, result, code);
    rows.push({ idx, stamp, name, cls: cls || '', result: result || '', code: code || '', ok: r.ok, mis: r.classMismatch ? r.cls : '', late: !!(due && stamp && stamp > due), key: normName(name) + '|' + (r.cls || String(cls).toUpperCase()) });
  });
  if (!rows.length) { out.innerHTML = '<p class="small">No rows found. Paste rows with a name, a class, a result and a code.</p>'; return; }
  const latest = {}; rows.forEach(r => { if (!r.ok || r.late) return; const p = latest[r.key]; if (!p || (r.stamp && p.stamp ? r.stamp >= p.stamp : r.idx > p.idx)) latest[r.key] = r; });
  const sum = {}; CLASSES.forEach(c => { sum[c] = { n: 0, w: {} }; });
  Object.values(latest).forEach(r => { const c = r.mis || String(r.cls).toUpperCase(); if (!sum[c]) sum[c] = { n: 0, w: {} }; sum[c].n++; (r.result.match(/W(\d)\s*PASS/gi) || []).forEach(m => { const w = m.match(/\d/)[0]; sum[c].w[w] = (sum[c].w[w] || 0) + 1; }); });
  const sumLines = Object.keys(sum).map(c => `<b>${c}</b>: ${sum[c].n} valid ticket${sum[c].n === 1 ? '' : 's'}${Object.keys(sum[c].w).length ? ' · ' + Object.keys(sum[c].w).sort().map(w => `World ${w} passed: ${sum[c].w[w]}`).join(' · ') : ''}`).join('<br>');
  out.innerHTML = `<div class="fb-line good">${sumLines}${skipped ? `<br><span style="color:var(--dim)">${skipped} row${skipped === 1 ? '' : 's'} from other games skipped.</span>` : ''}</div>`;
  const wrap = el('div', 'chk-wrap'); const t = el('table', 'chk-table');
  t.innerHTML = '<thead><tr><th>Name</th><th>Class</th><th>Result</th><th>Check</th></tr></thead>';
  const tb = document.createElement('tbody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    [r.name, r.cls, r.result].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    const td = document.createElement('td'); const used = latest[r.key] === r;
    td.className = r.ok && !r.late ? 'ok' : 'no';
    td.textContent = !r.ok ? 'Not valid' : r.late ? 'Valid, but sent after the time you set' : ('Valid' + (r.mis ? ` (code is for ${r.mis})` : '') + (used ? '' : ' · older ticket, not counted'));
    tr.appendChild(td); tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); out.appendChild(wrap);
}
